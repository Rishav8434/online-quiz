<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: layout(~{::title}, ~{::content})}">
<head>
    <title>Register &bull; Online Quiz Platform</title>
</head>
<body>
<div th:fragment="content">
    <div class="row justify-content-center">
        <div class="col-md-7 col-lg-6">
            <div class="card shadow-lg p-4 p-md-5">
                <div class="text-center mb-4">
                    <div class="d-inline-flex align-items-center justify-content-center bg-primary bg-opacity-10 text-primary rounded-circle mb-3" style="width: 56px; height: 56px;">
                        <i class="bi bi-person-plus-fill fs-3"></i>
                    </div>
                    <h2 class="fw-bold">Create Account</h2>
                    <p class="text-muted">Join the platform to test your knowledge or create quizzes</p>
                </div>

                <form id="registerForm">
                    <div class="mb-3">
                        <label for="fullName" class="form-label fw-semibold">Full Name</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="bi bi-card-text"></i></span>
                            <input type="text" class="form-control" id="fullName" required placeholder="e.g. Alice Johnson">
                        </div>
                    </div>

                    <div class="mb-3">
                        <label for="username" class="form-label fw-semibold">Username</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="bi bi-person"></i></span>
                            <input type="text" class="form-control" id="username" required placeholder="Choose a unique username">
                        </div>
                    </div>

                    <div class="mb-3">
                        <label for="email" class="form-label fw-semibold">Email Address</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="bi bi-envelope"></i></span>
                            <input type="email" class="form-control" id="email" required placeholder="name@example.com">
                        </div>
                    </div>

                    <div class="mb-3">
                        <label for="password" class="form-label fw-semibold">Password</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="bi bi-key"></i></span>
                            <input type="password" class="form-control" id="password" required minlength="6" placeholder="At least 6 characters">
                        </div>
                    </div>

                    <div class="mb-4">
                        <label for="role" class="form-label fw-semibold">I want to register as</label>
                        <select class="form-select" id="role">
                            <option value="ROLE_PARTICIPANT" selected>Participant (Attempt quizzes &amp; view leaderboards)</option>
                            <option value="ROLE_ADMIN">Administrator (Create quizzes &amp; view analytics)</option>
                        </select>
                    </div>

                    <button type="submit" id="registerBtn" class="btn btn-primary w-100 py-2 fs-6 mb-3">
                        Create Account
                    </button>
                </form>

                <div class="text-center mt-3">
                    <p class="text-muted small mb-0">Already have an account? <a th:href="@{/login}" class="text-primary fw-semibold">Sign In</a></p>
                </div>
            </div>
        </div>
    </div>

    <script>
        document.getElementById('registerForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('registerBtn');
            btn.disabled = true;
            btn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>Creating account...';

            const payload = {
                fullName: document.getElementById('fullName').value.trim(),
                username: document.getElementById('username').value.trim(),
                email: document.getElementById('email').value.trim(),
                password: document.getElementById('password').value,
                role: document.getElementById('role').value
            };

            try {
                const response = await fetch('/auth/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                if (response.ok) {
                    showToast('Account registered successfully! Redirecting to login...', 'success');
                    setTimeout(() => {
                        window.location.href = '/login?registered=true';
                    }, 1200);
                } else {
                    const err = await response.json();
                    let msg = err.message || 'Registration failed';
                    if (err.errors) {
                        msg = Object.values(err.errors).join(', ');
                    }
                    showToast(msg, 'error');
                    btn.disabled = false;
                    btn.innerHTML = 'Create Account';
                }
            } catch (err) {
                console.error(err);
                showToast('Unable to connect to server. Please try again.', 'error');
                btn.disabled = false;
                btn.innerHTML = 'Create Account';
            }
        });
    </script>
</div>
</body>
</html>
