<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: layout(~{::title}, ~{::content})}">
<head>
    <title>Reset Password &bull; Online Quiz Platform</title>
</head>
<body>
<div th:fragment="content">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="card shadow-lg p-4 p-md-5">
                <div class="text-center mb-4">
                    <div class="d-inline-flex align-items-center justify-content-center bg-primary bg-opacity-10 text-primary rounded-circle mb-3" style="width: 56px; height: 56px;">
                        <i class="bi bi-key-fill fs-3"></i>
                    </div>
                    <h2 class="fw-bold">Reset Password</h2>
                    <p class="text-muted">Enter your new secure password below.</p>
                </div>

                <div id="statusMessage" class="d-none alert mb-4" role="alert"></div>

                <form id="resetForm">
                    <input type="hidden" id="resetToken" th:value="${token}">

                    <div class="mb-3">
                        <label for="newPassword" class="form-label fw-semibold">New Password</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="bi bi-lock"></i></span>
                            <input type="password" class="form-control" id="newPassword" required minlength="6" placeholder="At least 6 characters">
                        </div>
                    </div>

                    <div class="mb-4">
                        <label for="confirmPassword" class="form-label fw-semibold">Confirm Password</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="bi bi-lock-fill"></i></span>
                            <input type="password" class="form-control" id="confirmPassword" required minlength="6" placeholder="Repeat new password">
                        </div>
                    </div>

                    <button type="submit" id="submitBtn" class="btn btn-primary w-100 py-2 fs-6 mb-3">
                        Set New Password
                    </button>
                </form>

                <div class="text-center mt-3">
                    <p class="text-muted small mb-0"><a th:href="@{/login}" class="text-primary fw-semibold">Back to Login</a></p>
                </div>
            </div>
        </div>
    </div>

    <script>
        document.getElementById('resetForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('submitBtn');
            const alertBox = document.getElementById('statusMessage');

            const token = document.getElementById('resetToken').value || new URLSearchParams(window.location.search).get('token');
            const newPassword = document.getElementById('newPassword').value;
            const confirmPassword = document.getElementById('confirmPassword').value;

            if (!token) {
                alertBox.className = 'alert alert-danger mb-4';
                alertBox.textContent = 'Reset token is missing. Please check your reset link.';
                alertBox.classList.remove('d-none');
                return;
            }

            if (newPassword !== confirmPassword) {
                alertBox.className = 'alert alert-danger mb-4';
                alertBox.textContent = 'Passwords do not match.';
                alertBox.classList.remove('d-none');
                return;
            }

            btn.disabled = true;
            btn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>Updating...';

            try {
                const response = await fetch('/api/auth/reset-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ token: token, newPassword: newPassword })
                });

                if (response.ok) {
                    alertBox.className = 'alert alert-success mb-4';
                    alertBox.textContent = 'Password reset successfully! Redirecting to login...';
                    alertBox.classList.remove('d-none');
                    setTimeout(() => {
                        window.location.href = '/login';
                    }, 2000);
                } else {
                    const err = await response.json();
                    alertBox.className = 'alert alert-danger mb-4';
                    alertBox.textContent = err.message || 'Invalid or expired reset token.';
                    alertBox.classList.remove('d-none');
                    btn.disabled = false;
                    btn.innerHTML = 'Set New Password';
                }
            } catch (err) {
                alertBox.className = 'alert alert-danger mb-4';
                alertBox.textContent = 'An error occurred. Please try again.';
                alertBox.classList.remove('d-none');
                btn.disabled = false;
                btn.innerHTML = 'Set New Password';
            }
        });
    </script>
</div>
</body>
</html>
