<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: layout(~{::title}, ~{::content})}">
<head>
    <title>Sign In &bull; Online Quiz Platform</title>
</head>
<body>
<div th:fragment="content">
    <div class="row justify-content-center py-4">
        <div class="col-md-7 col-lg-5">
            <div class="card p-4 p-md-5 shadow-lg border-0" style="border-radius: 20px;">
                <div class="text-center mb-4">
                    <div class="brand-icon-box mx-auto mb-3" style="width: 58px; height: 58px; font-size: 1.8rem; border-radius: 16px;">
                        <i class="bi bi-shield-lock-fill"></i>
                    </div>
                    <h2 class="fw-bold mb-1">Welcome Back</h2>
                    <p class="text-muted small">Enter your credentials to access your exams and analytics</p>
                </div>

                <div th:if="${errorMessage}" class="alert alert-danger d-flex align-items-center mb-4 py-2" role="alert">
                    <i class="bi bi-exclamation-triangle-fill me-2 fs-5"></i>
                    <div th:text="${errorMessage}">Invalid credentials</div>
                </div>

                <div th:if="${successMessage}" class="alert alert-success d-flex align-items-center mb-4 py-2" role="alert">
                    <i class="bi bi-check-circle-fill me-2 fs-5"></i>
                    <div th:text="${successMessage}">Registration successful</div>
                </div>

                <form id="loginForm">
                    <div class="mb-3">
                        <label for="usernameOrEmail" class="form-label fw-semibold small text-muted">Username or Email</label>
                        <div class="input-group shadow-sm">
                            <span class="input-group-text"><i class="bi bi-person"></i></span>
                            <input type="text" class="form-control" id="usernameOrEmail" required placeholder="admin or john">
                        </div>
                    </div>

                    <div class="mb-4">
                        <div class="d-flex justify-content-between align-items-center mb-1">
                            <label for="password" class="form-label fw-semibold small text-muted mb-0">Password</label>
                            <a th:href="@{/forgot-password}" class="text-primary small text-decoration-none">Forgot password?</a>
                        </div>
                        <div class="input-group shadow-sm">
                            <span class="input-group-text"><i class="bi bi-key"></i></span>
                            <input type="password" class="form-control" id="password" required placeholder="••••••••••••">
                        </div>
                    </div>

                    <button type="submit" id="loginBtn" class="btn btn-primary w-100 py-2.5 fs-6 fw-bold mb-3 shadow">
                        Sign In &rarr;
                    </button>
                </form>

                <div class="text-center mt-2">
                    <p class="text-muted small mb-0">Don't have an account? <a th:href="@{/register}" class="text-primary fw-bold text-decoration-none">Create Account</a></p>
                </div>

                <!-- Quick-Fill Demo Credentials Bar -->
                <div class="mt-4 pt-3 border-top">
                    <p class="small text-muted mb-2 text-center"><strong>Demo Credentials (Click to prefill):</strong></p>
                    <div class="d-flex gap-2">
                        <button type="button" class="btn btn-sm btn-light border flex-fill text-primary fw-semibold" onclick="fillCreds('admin', 'Admin@123456')">
                            <i class="bi bi-shield-lock me-1"></i> Admin Portal
                        </button>
                        <button type="button" class="btn btn-sm btn-light border flex-fill text-success fw-semibold" onclick="fillCreds('john', 'John@123456')">
                            <i class="bi bi-mortarboard me-1"></i> Participant
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        function fillCreds(user, pass) {
            document.getElementById('usernameOrEmail').value = user;
            document.getElementById('password').value = pass;
            showToast(`Prefilled credentials for ${user}`, 'info');
        }

        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('loginBtn');
            btn.disabled = true;
            btn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>Authenticating...';

            const payload = {
                usernameOrEmail: document.getElementById('usernameOrEmail').value.trim(),
                password: document.getElementById('password').value
            };

            try {
                const response = await fetch('/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                if (response.ok) {
                    const data = await response.json();
                    AppAuth.setToken(data.accessToken, data.user);
                    const isAdmin = data.user.roles && data.user.roles.includes('ROLE_ADMIN');
                    showToast('Authentication successful! Redirecting...', 'success');
                    setTimeout(() => {
                        window.location.href = isAdmin ? '/admin/dashboard' : '/dashboard';
                    }, 500);
                } else {
                    const err = await response.json();
                    showToast(err.message || 'Invalid username or password', 'error');
                    btn.disabled = false;
                    btn.innerHTML = 'Sign In &rarr;';
                }
            } catch (err) {
                console.error(err);
                showToast('Unable to connect to server. Please try again.', 'error');
                btn.disabled = false;
                btn.innerHTML = 'Sign In &rarr;';
            }
        });
    </script>
</div>
</body>
</html>
