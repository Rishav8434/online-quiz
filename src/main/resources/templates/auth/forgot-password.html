<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: layout(~{::title}, ~{::content})}">
<head>
    <title>Forgot Password &bull; Online Quiz Platform</title>
</head>
<body>
<div th:fragment="content">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="card shadow-lg p-4 p-md-5">
                <div class="text-center mb-4">
                    <div class="d-inline-flex align-items-center justify-content-center bg-warning bg-opacity-10 text-warning rounded-circle mb-3" style="width: 56px; height: 56px;">
                        <i class="bi bi-envelope-exclamation fs-3"></i>
                    </div>
                    <h2 class="fw-bold">Forgot Password?</h2>
                    <p class="text-muted">Enter your registered email and we'll send you instructions to reset your password.</p>
                </div>

                <div id="statusMessage" class="d-none alert mb-4" role="alert"></div>

                <form id="forgotForm">
                    <div class="mb-4">
                        <label for="email" class="form-label fw-semibold">Email Address</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="bi bi-envelope"></i></span>
                            <input type="email" class="form-control" id="email" required placeholder="name@example.com">
                        </div>
                    </div>

                    <button type="submit" id="submitBtn" class="btn btn-primary w-100 py-2 fs-6 mb-3">
                        Send Reset Link
                    </button>
                </form>

                <div class="text-center mt-3">
                    <p class="text-muted small mb-0">Remembered your password? <a th:href="@{/login}" class="text-primary fw-semibold">Back to Login</a></p>
                </div>
            </div>
        </div>
    </div>

    <script>
        document.getElementById('forgotForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('submitBtn');
            const alertBox = document.getElementById('statusMessage');
            btn.disabled = true;
            btn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>Sending...';

            const email = document.getElementById('email').value.trim();

            try {
                const response = await fetch('/api/auth/forgot-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email: email })
                });

                const data = await response.json();
                alertBox.className = 'alert alert-success d-flex align-items-center mb-4';
                alertBox.innerHTML = '<i class="bi bi-check-circle-fill me-2"></i><div>' + (data.message || 'If an account exists, a reset link was sent.') + '</div>';
                alertBox.classList.remove('d-none');
                btn.innerHTML = 'Sent!';
            } catch (err) {
                alertBox.className = 'alert alert-danger d-flex align-items-center mb-4';
                alertBox.innerHTML = '<i class="bi bi-exclamation-triangle-fill me-2"></i><div>Unable to send reset email. Please try again later.</div>';
                alertBox.classList.remove('d-none');
                btn.disabled = false;
                btn.innerHTML = 'Send Reset Link';
            }
        });
    </script>
</div>
</body>
</html>
