<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head></head>
<body>
<nav th:fragment="navbar" class="navbar navbar-expand-lg app-navbar sticky-top border-bottom">
    <div class="container">
        <a class="navbar-brand d-flex align-items-center gap-2" th:href="@{/}">
            <div class="brand-icon-box">
                <i class="bi bi-patch-question-fill"></i>
            </div>
            <span class="brand-text">Online<span class="brand-accent">Quiz</span></span>
        </a>

        <button class="navbar-toggler border-0 shadow-none" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
            <i class="bi bi-list fs-2"></i>
        </button>

        <div class="collapse navbar-collapse" id="navbarSupportedContent">
            <ul class="navbar-nav me-auto mb-2 mb-lg-0 ms-lg-3 gap-1">
                <li class="nav-item">
                    <a class="nav-link px-3" th:href="@{/quizzes}">
                        <i class="bi bi-grid me-1"></i> Quizzes
                    </a>
                </li>
                <li class="nav-item" sec:authorize="isAuthenticated()">
                    <a class="nav-link px-3" th:href="@{/dashboard}">
                        <i class="bi bi-speedometer2 me-1"></i> Dashboard
                    </a>
                </li>
                <li class="nav-item" sec:authorize="isAuthenticated()">
                    <a class="nav-link px-3" th:href="@{/history}">
                        <i class="bi bi-clock-history me-1"></i> My History
                    </a>
                </li>
                <li class="nav-item" sec:authorize="hasRole('ADMIN')">
                    <a class="nav-link px-3 admin-nav-link" th:href="@{/admin/dashboard}">
                        <i class="bi bi-shield-lock-fill me-1"></i> Admin Portal
                    </a>
                </li>
            </ul>

            <ul class="navbar-nav ms-auto align-items-center gap-2">
                <!-- Theme Toggle Button -->
                <li class="nav-item">
                    <button type="button" class="btn btn-theme-toggle" id="themeToggleBtn" onclick="AppTheme.toggle()" title="Toggle Dark/Light Mode" aria-label="Toggle Theme">
                        <i class="bi bi-moon-stars-fill theme-icon-dark"></i>
                        <i class="bi bi-sun-fill theme-icon-light d-none"></i>
                    </button>
                </li>

                <!-- Swagger API Docs Link -->
                <li class="nav-item me-1 d-none d-md-block">
                    <a class="nav-link api-badge-link" th:href="@{/swagger-ui.html}" target="_blank" title="OpenAPI / Swagger 3 Docs">
                        <span class="badge border"><i class="bi bi-file-earmark-code me-1"></i>API Docs</span>
                    </a>
                </li>

                <!-- Authenticated User Dropdown -->
                <li class="nav-item dropdown" sec:authorize="isAuthenticated()">
                    <a class="nav-link dropdown-toggle user-menu-toggle d-flex align-items-center gap-2" href="#" id="userDropdown" role="button" data-bs-toggle="dropdown" aria-expanded="false">
                        <div class="user-avatar-badge">
                            <span sec:authentication="name" th:text="${#strings.substring(#authentication.name,0,1).toUpperCase()}">U</span>
                        </div>
                        <span sec:authentication="name" class="fw-semibold user-name-text">User</span>
                    </a>
                    <ul class="dropdown-menu dropdown-menu-end shadow-lg border-0 modern-dropdown" aria-labelledby="userDropdown">
                        <li class="dropdown-header px-3 py-2">
                            <div class="small text-muted">Signed in as</div>
                            <div class="fw-bold text-truncate" sec:authentication="name">User</div>
                        </li>
                        <li><hr class="dropdown-divider"></li>
                        <li><a class="dropdown-item" th:href="@{/dashboard}"><i class="bi bi-speedometer2 me-2"></i>Dashboard</a></li>
                        <li><a class="dropdown-item" th:href="@{/history}"><i class="bi bi-clock-history me-2"></i>Attempt History</a></li>
                        <li sec:authorize="hasRole('ADMIN')"><hr class="dropdown-divider"></li>
                        <li sec:authorize="hasRole('ADMIN')"><a class="dropdown-item" th:href="@{/admin/dashboard}"><i class="bi bi-kanban me-2"></i>Manage Quizzes</a></li>
                        <li sec:authorize="hasRole('ADMIN')"><a class="dropdown-item" th:href="@{/admin/quizzes/create}"><i class="bi bi-plus-circle me-2"></i>Create Assessment</a></li>
                        <li sec:authorize="hasRole('ADMIN')"><a class="dropdown-item" th:href="@{/admin/analytics}"><i class="bi bi-graph-up me-2"></i>Global Analytics</a></li>
                        <li><hr class="dropdown-divider"></li>
                        <li><a class="dropdown-item text-danger" href="javascript:void(0);" onclick="AppAuth.logout();"><i class="bi bi-box-arrow-right me-2"></i>Sign Out</a></li>
                    </ul>
                </li>

                <!-- Anonymous Visitor Navigation -->
                <li class="nav-item" sec:authorize="isAnonymous()">
                    <a class="nav-link fw-semibold px-3" th:href="@{/login}">Login</a>
                </li>
                <li class="nav-item" sec:authorize="isAnonymous()">
                    <a class="btn btn-primary px-3 py-2 fw-semibold" th:href="@{/register}">Sign Up</a>
                </li>
            </ul>
        </div>
    </div>
</nav>
</body>
</html>
