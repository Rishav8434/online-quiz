<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: layout(~{::title}, ~{::content})}">
<head>
    <title th:text="${'Edit: ' + quiz.title + ' &bull; Admin Portal'}">Edit Quiz</title>
</head>
<body>
<div th:fragment="content">
    <div class="d-flex justify-content-between align-items-center mb-4 pb-2 border-bottom">
        <div>
            <a th:href="@{/admin/dashboard}" class="text-muted small d-inline-flex align-items-center mb-1">
                <i class="bi bi-arrow-left me-1"></i> Back to Dashboard
            </a>
            <h2 class="fw-bold mb-0">Edit Assessment Details</h2>
        </div>
    </div>

    <div class="row justify-content-center">
        <div class="col-lg-8">
            <div class="card p-4 p-md-5 shadow-sm">
                <form id="editQuizForm">
                    <div class="mb-3">
                        <label for="title" class="form-label fw-semibold">Quiz Title</label>
                        <input type="text" class="form-control" id="title" th:value="${quiz.title}" required>
                    </div>

                    <div class="mb-3">
                        <label for="durationMinutes" class="form-label fw-semibold">Duration (Minutes)</label>
                        <input type="number" class="form-control" id="durationMinutes" th:value="${quiz.durationMinutes}" min="1" max="180" required>
                    </div>

                    <div class="mb-3">
                        <label for="description" class="form-label fw-semibold">Description</label>
                        <textarea class="form-control" id="description" rows="4" th:text="${quiz.description}"></textarea>
                    </div>

                    <div class="form-check form-switch mb-4">
                        <input class="form-check-input" type="checkbox" id="published" th:checked="${quiz.published}">
                        <label class="form-check-label fw-semibold" for="published">Published (Visible to participants)</label>
                    </div>

                    <div class="d-flex justify-content-between">
                        <a th:href="@{/admin/dashboard}" class="btn btn-light border">Cancel</a>
                        <button type="submit" id="saveBtn" class="btn btn-primary px-4 fw-semibold">Save Changes</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script th:inline="javascript">
        /*<![CDATA[*/
        const quizId = /*[[${quiz.id}]]*/ 1;

        document.getElementById('editQuizForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('saveBtn');
            btn.disabled = true;
            btn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>Saving...';

            const payload = {
                title: document.getElementById('title').value.trim(),
                durationMinutes: parseInt(document.getElementById('durationMinutes').value, 10),
                description: document.getElementById('description').value.trim(),
                published: document.getElementById('published').checked
            };

            try {
                const response = await AppAuth.fetchAuth(`/api/quizzes/${quizId}`, {
                    method: 'PUT',
                    body: JSON.stringify(payload)
                });

                if (response && response.ok) {
                    showToast('Quiz updated successfully', 'success');
                    setTimeout(() => window.location.href = '/admin/dashboard', 1000);
                } else {
                    const err = await response.json();
                    showToast(err.message || 'Update failed', 'error');
                    btn.disabled = false;
                    btn.innerHTML = 'Save Changes';
                }
            } catch (err) {
                console.error(err);
                showToast('Network error while updating quiz', 'error');
                btn.disabled = false;
                btn.innerHTML = 'Save Changes';
            }
        });
        /*]]>*/
    </script>
</div>
</body>
</html>
